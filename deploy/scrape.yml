# Curator /metrics scrape config — docs/architecture.md §12 «Наблюдаемость».
#
# Drop this job into a Prometheus / vmagent scrape configuration. The `job="curator"`
# label is what deploy/alerts.yml matches — do not rename it without updating that file.
#
# The credential is METRICS_TOKEN (read-only, opens only /metrics), never ADMIN_TOKEN
# (§12). Placeholders below are XXX — inject the real values at deploy time:
#   * bearer_token  -> the value of METRICS_TOKEN (must equal the service's env).
#   * target host   -> the public Traefik host that serves the curator over TLS.

scrape_configs:
  - job_name: curator          # matches deploy/alerts.yml (`up{job="curator"}`)
    scheme: https              # WSS/HTTPS only — the cert must be browser/CA-trusted
    metrics_path: /metrics
    # METRICS_TOKEN (read-only, §12). Placeholder — inject the real value at deploy.
    bearer_token: XXX
    static_configs:
      - targets:
          - curator.example.com   # the Traefik Host() that routes to the container
