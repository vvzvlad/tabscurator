name: Tests

# PR tests live apart from image-check-publish.yml, which must never run on
# pull_request: a PR build would push the `:develop` tag production deploys from.
# `develop` is the default branch (`main` is reserved for releases).
on:
  # Manual re-run; safe because this workflow touches no registry and no secrets.
  workflow_dispatch:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read   # checkout

# Unlike the image workflow, cancelling is right here: these jobs produce no
# artifacts, so a superseded test run is just wasted runner time.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Keep these three jobs byte-identical to their twins in image-check-publish.yml:
# the PR gate and the post-merge gate must be the same gate, or a PR goes green
# on a weaker check than the one that guards the image.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        METRICS_TOKEN: test-metrics-token   # required ENV so importing settings works
        ADMIN_TOKEN: test-admin-token       # required + must differ from METRICS_TOKEN (§13)
      run: pytest --tb=short -q

    # The alert rules (§12) are validated in the test job, not a job of their own, so
    # `build: needs: test` in image-check-publish.yml gates the image on them: a rules file
    # that does not parse would ship a curator with no alerts. promtool is not a Python
    # dep, so it is fetched here, pinned to the Prometheus LTS line.
    - name: Install promtool
      env:
        PROMETHEUS_VERSION: "3.5.5"   # LTS
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" --strip-components=1 \
              "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
        "$HOME/.local/bin/promtool" --version
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # `make alerts` is the single definition of "validated" (schema check + the cases
    # in deploy/alerts_test.yml). CI=true turns its "promtool missing -> skip" branch
    # into a hard failure.
    - name: Validate the Prometheus alert rules
      env:
        CI: "true"
      run: make alerts

  # Extension (MV3) tests: independent Node/vitest toolchain under extension/.
  # Present here so a PR is checked against the same suites a push to `develop`
  # runs — a PR that only touches extension/ would otherwise have no gate at all.
  extension-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install and test the extension
      working-directory: extension
      run: |
        npm ci || npm install
        npm test

  # Startpage (Vue 3 + Vite) tests: build INTO extension/startpage, then the three
  # §10 build gates and the vitest suite (the render smoke test loads the built
  # bundle, so the build must run first). Independent of the Python image build.
  startpage-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build, gate and test the startpage
      working-directory: startpage
      run: |
        npm ci || npm install
        npm run build
        npm run gates
        npm test

    # The build writes into the tracked extension/startpage, and the Vite build is
    # byte-reproducible, so any difference from HEAD means the committed bundle is stale.
    # `git status --porcelain`, not `git diff`: the chunk filename carries a content
    # hash, so a changed bundle shows up as a new untracked file that `git diff` ignores.
    - name: Fail if the committed startpage bundle is stale (drift from a fresh build)
      run: |
        if [ -n "$(git status --porcelain -- extension/startpage)" ]; then
          git status --porcelain -- extension/startpage
          echo "::error::extension/startpage is out of date vs a fresh build — run 'npm --prefix startpage run build' and commit extension/startpage."
          exit 1
        fi
