name: Docker Image CI

# No `pull_request` trigger on purpose: a PR build would push the `:develop` tag
# this repo's production deploys from, and watchtower on the production host
# polls every 10 seconds. Tests for pull requests live in tests.yml, which has no
# build job, no docker push and no registry secret.
on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea
# Actions — the built-in GITEA_TOKEN carries no package scope at all. The registry push
# below authenticates with the REGISTRY_TOKEN PAT from the org secrets instead.
permissions:
  contents: read   # checkout

# Runs on one branch are serialised so the newest commit's tag is written last.
# `cancel-in-progress: false` keeps a running build alive; a queued run is still cancelled
# by a newer push, so not every commit gets an image.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        METRICS_TOKEN: test-metrics-token   # required ENV so importing settings works
        ADMIN_TOKEN: test-admin-token       # required + must differ from METRICS_TOKEN (§13)
      run: pytest --tb=short -q

    # The alert rules (§12) are validated in the test job, not a job of their own, so
    # `build: needs: test` in image-check-publish.yml gates the image on them: a rules file
    # that does not parse would ship a curator with no alerts. promtool is not a Python
    # dep, so it is fetched here, pinned to the Prometheus LTS line.
    - name: Install promtool
      env:
        PROMETHEUS_VERSION: "3.5.5"   # LTS
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" --strip-components=1 \
              "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
        "$HOME/.local/bin/promtool" --version
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # `make alerts` is the single definition of "validated" (schema check + the cases
    # in deploy/alerts_test.yml). CI=true turns its "promtool missing -> skip" branch
    # into a hard failure.
    - name: Validate the Prometheus alert rules
      env:
        CI: "true"
      run: make alerts

  # Extension (MV3) tests: independent Node/vitest toolchain under extension/.
  # Kept separate from the Python `test` job and NOT a dependency of `build`
  # (the image ships the Python service only). Runs on the same triggers as the
  # rest of this workflow (push to main/develop + workflow_dispatch); it does NOT
  # block the image build. PR-level gating for it lives in tests.yml.
  extension-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install and test the extension
      working-directory: extension
      run: |
        npm ci || npm install
        npm test

  # Startpage (Vue 3 + Vite) tests: build INTO extension/startpage, then the three
  # §10 build gates and the vitest suite (the render smoke test loads the built
  # bundle, so the build must run first). Independent of the Python image build.
  startpage-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build, gate and test the startpage
      working-directory: startpage
      run: |
        npm ci || npm install
        npm run build
        npm run gates
        npm test

    # The build writes into the tracked extension/startpage, and the Vite build is
    # byte-reproducible, so any difference from HEAD means the committed bundle is stale.
    # `git status --porcelain`, not `git diff`: the chunk filename carries a content
    # hash, so a changed bundle shows up as a new untracked file that `git diff` ignores.
    - name: Fail if the committed startpage bundle is stale (drift from a fresh build)
      run: |
        if [ -n "$(git status --porcelain -- extension/startpage)" ]; then
          git status --porcelain -- extension/startpage
          echo "::error::extension/startpage is out of date vs a fresh build — run 'npm --prefix startpage run build' and commit extension/startpage."
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # develop -> :develop, the tag watchtower deploys in production.
      # main -> :latest + :<sha>, reserved for releases.
      # Any other branch gets its own :<branch> tag, never :develop.
      env:
        # Passed through the environment instead of being interpolated into the
        # script text: git allows `$`, backticks, quotes and parentheses in branch
        # names, so a branch like `feat/$(id)` would otherwise execute on the runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not
        # accept them in an image path — a repo like `TabsCurator` would fail the
        # build with `invalid reference format`, so lowercase it here.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        # Do not change this to `develop`: production pulls
        # `gitea.vvzvlad.xyz/projects/tabscurator:develop`, which the ELSE branch below
        # produces from the branch name. `main` is the reserved release branch.
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest moves only
          # after the immutable :<sha> rollback point is in the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
        else
          # Sanitise into a legal docker tag ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}):
          # illegal characters become `-`, a bad first character becomes `_`, and the
          # result is cut to 100 chars. `develop` passes through unchanged.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` must not publish the release tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    # BUILD_REVISION stamps the commit into the image (it has no git); /healthz and
    # /admin report it, since the reused `:develop` tag identifies nothing.
    - name: Build the Docker image
      env:
        # Passed through the environment, not interpolated into the script text.
        # `$TAGS` is intentionally unquoted: word splitting turns the list into items.
        TAGS: ${{ steps.tags.outputs.tags }}
        REVISION: ${{ github.sha }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted runner's docker daemon is persistent, so a cached
        # base image would otherwise never get updates.
        docker build --pull . --file Dockerfile \
          --build-arg BUILD_REVISION="$REVISION" $tag_args

    # After the build: the build needs no registry credentials, so REGISTRY_TOKEN
    # stays out of the daemon's config while it runs.
    - name: Log in to the Gitea container registry
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with the `write:package` scope, stored as an ORG secret on `projects`.
        # A repo-level secret of the same name would shadow it — keep it at the org.
        # The built-in GITEA_TOKEN cannot be used here: it carries no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the built images from the runner
      # The runner's daemon is persistent and shared with other repos, so only the
      # tags this run created are removed (no `docker system prune`). The BuildKit
      # cache and dangling base images need a separate cleanup on the runner host.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
